<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark interior</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">.ArtRoom</div>
        <div class="menu">
            <a href="#">Главная</a>
            <a class="works" href="#">Работы</a>
            <a href="#">Контакты</a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="left">
                <div class="text">
                    <h3>Стиль</h3>
                    <h1>Dark Interior</h1>
                </div>
            </div>
            <div class="slider">
                <div class="slider-1">
                    <img src="img/1.jpg" alt="1 картинка">
                </div>
                <div class="slider-2">
                    <img src="img/2.jpg" alt="2 картинка">
                </div>
                <div class="slider-3">
                    <img src="img/3.jpg" alt="3 картинка">
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container-aquare">
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </div>
        <div class="switch">
            <div class="arrows">
                <div class="arrow-left">←</div>
                <div class="numbers">1/5</div>
                <div class="arrow-right">→</div>
            </div>
        </div>
    </footer>
    <div class="modal" id="modal">
        <span class="close" id="closeModal">✕</span>
        <img class="modal-content" id="modalImage">
    </div>
    <script src="script.js"></script>
</body>

</html>
